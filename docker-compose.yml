version: '3.8'

services:
  ticket-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-system
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/tickets.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
