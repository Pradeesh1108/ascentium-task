<html lang="en">

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { theme: { extend: { colors: { canvas: 'var(--canvas)', surf: 'var(--surf)', ink: 'var(--ink)', mute: 'var(--mute)', line: 'var(--line)', sage: 'var(--sage)', sagebg: 'var(--sagebg)', ochre: 'var(--ochre)', ochrebg: 'var(--ochrebg)', terra: 'var(--terra)', terrabg: 'var(--terrabg)' }, fontFamily: { serif: ['"DM Serif Display"', 'Georgia', 'serif'], sans: ['"DM Sans"', 'system-ui', 'sans-serif'], mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'] } } } }</script>
  <style>

      --surf: #FFFFFF;
      --ink: #20231F;
      --mute: #777A72;
      --line: #E6E4DC;

      --ochre: #B68A4B;
      --ochrebg: #F5EEDF;

      --terrabg: #F5E9E5;

      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --canvas: #1A1B18;
        --surf: #232420;
        --ink: #ECEAE2;
        --mute: #A3A69C;
        --line: #35362F;
        --sage: #9DB39B;
        --sagebg: #26302A;

        --ochrebg: #33291A;
        --terra: #D98B7C;

    }

    :root[data-theme="dark"] {
      --canvas: #1A1B18;
      --surf: #232420;
      --ink: #ECEAE2;
      --mute: #A3A69C;
      --line: #35362F;
      --sage: #9DB39B;
      --sagebg: #26302A;
      --ochre: #D2A965;
      --ochrebg: #33291A;
      --terra: #D98B7C;

    }

      background: var(--canvas);

    }

      font-variant-numeric: tabular-nums

</head>

<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script>
    const { useState, useEffect, useRef, useCallback, useMemo } = React, h = React.createElement;
    const cx = (...a) => a.filter(Boolean).join(' ');
    /* ===== API client (live mode). BASE = import.meta.env.VITE_API_URL in the Vite port. Response shapes are ASSUMED: adjust the normalize* fns below. ===== */
    const BASE = (typeof window !== 'undefined' && window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file')) ? window.location.origin : 'http://localhost:8000';
    const J = async (p, o) => { const r = await fetch(BASE + p, o); let b = null; try { b = await r.json() } catch (e) { } if (!r.ok) throw new Error((b && (b.detail || b.message)) || 'HTTP ' + r.status); return b };

    const E = encodeURIComponent;
    const liveApi = {
      health: () => J('/health'),
      stats: () => J('/stats'),
      list: fl => {
        const p = new URLSearchParams();
        p.set('limit', '20');
        if (fl && fl.page) p.set('page', fl.page);
        if (fl && fl.status) p.set('status', fl.status);
        if (fl && fl.cat) p.set('category', fl.cat);
        if (fl && fl.urg) p.set('urgency', fl.urg);
        if (fl && fl.q) p.set('q', fl.q);
        return J('/messages?' + p.toString());
      },
      get: i => J('/messages/' + E(i)),
      retry: i => J('/messages/' + E(i) + '/retry', { method: 'POST' }),
      retryAll: () => J('/messages/retry-failed', { method: 'POST' }),
      submit: b => J('/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }),
      export: async () => { const r = await fetch(BASE + '/results/export'); if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob() },
      practice: () => J('/practice-messages')
    };

    const normListResponse = x => {
      if (Array.isArray(x)) return { items: x, total: x.length, page: 1, limit: x.length, totalPages: 1 };
      const items = (x && (x.items || x.messages)) || [];
      const total = typeof x?.total === 'number' ? x.total : items.length;
      const limit = x?.limit || 20;
      const page = x?.page || 1;
      const totalPages = x?.total_pages || Math.max(1, Math.ceil(total / limit));
      return { items, total, page, limit, totalPages };
    };
    const hs = x => { const o = typeof x === 'string' ? { status: x } : x || {}; const s = String(o.status || o.state || '').toLowerCase(); return { status: ['ok', 'up', 'healthy', 'connected'].includes(s) ? 'healthy' : ['degraded', 'slow'].includes(s) ? 'degraded' : ['down', 'error', 'unavailable', 'failed'].includes(s) ? 'unavailable' : 'unknown', detail: o.detail || o.message || o.error || null, at: o.checked_at || o.last_checked || null } };
    const normHealth = x => x ? { llm: hs(x.llm ?? x.llm_service), storage: hs(x.storage ?? x.database ?? x.db) } : null;
    const normStats = s => s ? { received: s.received, in_progress: s.in_progress, completed: s.completed, failed: s.failed, rejected: s.rejected, duplicates_ignored: s.duplicates_ignored ?? s.duplicates, llm_calls: s.llm_calls ?? s.total_llm_calls, repeated_llm_calls: s.repeated_llm_calls } : null;
    /* ===== Demo backend: clearly labelled sample data, never shown in Live mode ===== */
    const ago = m => new Date(Date.now() - m * 6e4).toISOString();
    const mk = (id, text, o) => ({ message_id: id, text, status: 'received', category: null, order_id: null, product: null, urgency: null, requested_action: null, attempts: 0, failure_reason: null, created_at: ago(30), updated_at: ago(5), extraction: { status: 'pending' }, classification: { status: 'pending' }, calls: 0, ...o });
    const done = (r) => ({ status: 'done', result: r });
    const D = {
      dup: 2, llmDown: false, msgs: [
        mk('demo-1001', 'Order 48213 arrived with a cracked screen on the Aero X2 tablet. Please ship a replacement.', { status: 'completed', category: 'Damaged item', order_id: '48213', product: 'Aero X2 tablet', urgency: 'high', requested_action: 'Send replacement', attempts: 1, calls: 2, created_at: ago(42), updated_at: ago(40), extraction: done({ order_id: '48213', product: 'Aero X2 tablet' }), classification: done({ category: 'Damaged item', urgency: 'high', requested_action: 'Send replacement' }) }),
        mk('demo-1002', 'Where is my parcel? Order 77120, the Linen throw. It was due last week.', { status: 'completed', category: 'Delivery delay', order_id: '77120', product: 'Linen throw', urgency: 'medium', requested_action: 'Track shipment', attempts: 1, calls: 2, created_at: ago(38), updated_at: ago(36), extraction: done({ order_id: '77120', product: 'Linen throw' }), classification: done({ category: 'Delivery delay', urgency: 'medium', requested_action: 'Track shipment' }) }),
        mk('demo-1003', 'I was charged twice for order 55871 (Ceramic pour-over set). Refund the duplicate please.', { status: 'failed', category: null, order_id: '55871', product: 'Ceramic pour-over set', attempts: 3, calls: 5, failure_reason: 'Classification: LLM API timeout after 30s (retry limit reached)', created_at: ago(25), updated_at: ago(12), extraction: done({ order_id: '55871', product: 'Ceramic pour-over set' }), classification: { status: 'failed' } }),
        mk('demo-1004', 'Can I change the delivery address on order 90412? Moving flats on Friday.', { status: 'pending_retry', order_id: '90412', attempts: 1, calls: 3, failure_reason: 'Classification: 429 rate limited', created_at: ago(9), updated_at: ago(2), extraction: done({ order_id: '90412', product: null }), classification: { status: 'pending' } }),
        mk('demo-1005', '', { status: 'rejected', failure_reason: 'Validation: message text is empty', created_at: ago(20), updated_at: ago(20) }),
        mk('demo-1006', 'My Orbit kettle will not switch on. Order 31877. Is it under warranty?', { status: 'received', created_at: ago(1), updated_at: ago(1) })]
    };
    const sleep = ms => new Promise(r => setTimeout(r, ms)), cl = x => JSON.parse(JSON.stringify(x));
    /* Demo interval disabled: dashboard runs in live production mode */
    const demoApi = {

      async health() { await sleep(120); return { llm: { status: D.llmDown ? 'unavailable' : 'healthy', detail: D.llmDown ? 'Simulated: upstream API not responding' : null }, storage: { status: 'healthy' } } },
      async stats() { await sleep(120); const c = s => D.msgs.filter(m => s.includes(m.status)).length; return { received: D.msgs.length, in_progress: c(['received', 'processing', 'pending_retry']), completed: c(['completed']), failed: c(['failed']), rejected: c(['rejected']), duplicates_ignored: D.dup, llm_calls: D.msgs.reduce((a, m) => a + m.calls, 0), repeated_llm_calls: D.msgs.reduce((a, m) => a + Math.max(0, m.calls - 2), 0) } },
      async list(fl) {
        await sleep(120);
        let arr = D.msgs;
        if (fl && fl.status) arr = arr.filter(m => m.status === fl.status);
        if (fl && fl.cat) arr = arr.filter(m => m.category === fl.cat);
        if (fl && fl.urg) arr = arr.filter(m => m.urgency === fl.urg);
        if (fl && fl.q) {
          const q = fl.q.toLowerCase();
          arr = arr.filter(m => (m.message_id + ' ' + (m.text || '')).toLowerCase().includes(q));
        }
        const page = (fl && fl.page) || 1, limit = 20;
        const total = arr.length;
        const items = arr.slice((page - 1) * limit, page * limit);
        return { items: cl(items), total, page, limit, total_pages: Math.max(1, Math.ceil(total / limit)) };
      },
      async get(i) { await sleep(80); const m = D.msgs.find(x => x.message_id === i); if (!m) throw new Error('Message not found'); return cl(m) },
      async retry(i) { await sleep(400); const m = D.msgs.find(x => x.message_id === i); if (!m) throw new Error('Message not found'); if (m.status !== 'failed') return { ok: false, reason: 'Not eligible: status is ' + m.status + ', only failed messages can be retried.' }; m.status = 'pending_retry'; m.updated_at = ago(0); return { ok: true, message: 'Retry scheduled for ' + i } },
      async retryAll() { await sleep(500); const f = D.msgs.filter(m => m.status === 'failed'); f.forEach(m => { m.status = 'pending_retry'; m.updated_at = ago(0) }); return { ok: true, message: f.length + ' failed message(s) scheduled for retry' } },
      async submit(b) { await sleep(300); if (D.msgs.some(m => m.message_id === b.message_id)) { D.dup++; return { status: 'duplicate', message: 'Duplicate delivery ignored; the original record is unchanged.' } } D.msgs.push(mk(b.message_id, b.text, { created_at: ago(0), updated_at: ago(0) })); return { status: 'accepted', message: 'Message accepted and persisted.' } },
      async export() { await sleep(300); return new Blob([JSON.stringify(D.msgs.filter(m => m.status === 'completed').map(m => ({ message_id: m.message_id, category: m.category, order_id: m.order_id, product: m.product, urgency: m.urgency, requested_action: m.requested_action })), null, 2)], { type: 'application/json' }) }
    };
    /* ===== Helpers ===== */
    const ST = { completed: ['bg-sage', 'Completed'], failed: ['bg-terra', 'Failed'], rejected: ['bg-terra', 'Rejected'], processing: ['bg-ochre', 'Processing'], pending_retry: ['bg-ochre', 'Waiting to retry'], received: ['bg-mute', 'Received'] };
    const Dot = ({ s }) => {
      const t = ST[s] || ['bg-mute', s || 'Unknown'];
      const isP = s === 'processing';
      return h('span', { className: 'inline-flex items-center gap-1.5 text-xs whitespace-nowrap' },
        h('span', { className: 'relative flex h-2 w-2' },
          isP && h('span', { className: 'animate-ping absolute inline-flex h-full w-full rounded-full bg-ochre opacity-75' }),
          h('span', { className: 'relative inline-flex rounded-full h-2 w-2 ' + t[0] })
        ),
        t[1]
      );
    };

    const parseUtcDate = t => {
      if (!t) return null;
      if (t instanceof Date) return t;
      let s = String(t).trim();
      // SQLite stores UTC as 'YYYY-MM-DD HH:MM:SS'. Without Z, browsers parse it as local time!
      if (s.includes(' ') && !s.includes('Z') && !s.includes('+')) {
        s = s.replace(' ', 'T') + 'Z';
      } else if (!s.endsWith('Z') && !s.includes('+') && s.includes('T')) {
        s = s + 'Z';
      }
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    };
    const fmt = t => { const d = parseUtcDate(t); return d ? d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'medium' }) : 'No timestamp'; };
    const rel = t => { const d = parseUtcDate(t); if (!d) return '—'; const s = Math.max(0, (Date.now() - d.getTime()) / 1e3); return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : d.toLocaleDateString(); };

    const Time = ({ t }) => h('time', { title: fmt(t), dateTime: t || undefined, className: 'font-mono text-xs text-mute' }, rel(t));
    const v = x => x == null || x === '' ? '—' : x;
    const num = x => x == null || typeof x !== 'number' ? '—' : x.toLocaleString();
    const Btn = ({ kind, className, ...p }) => h('button', { ...p, className: cx('inline-flex items-center justify-center gap-1.5 rounded-md border px-3 py-1.5 text-xs font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed', kind === 'solid' ? 'border-ink bg-ink text-canvas hover:opacity-90' : kind === 'danger' ? 'border-terra text-terra hover:bg-terrabg' : 'border-line bg-surf hover:border-mute', className) });
    const Card = ({ className, children }) => h('section', { className: cx('rounded-lg border border-line bg-surf', className) }, children);
    const isDone = s => s === 'done' || s === 'completed';
    const stageStates = d => {
      if (!d) return Array(8).fill('todo');
      const c = isDone(d.classification?.status), e = isDone(d.extraction?.status), s = d.status;
      if (s === 'rejected') return ['done', 'fail', ...Array(6).fill('todo')];
      if (s === 'completed') return Array(8).fill('done');
      const isOther = d.category === 'Other';
      const n = (isOther && c) ? 6 : e ? 6 : c ? 4 : s === 'received' ? 1 : 2;
      const a = Array(8).fill('todo');
      for (let i = 0; i < n; i++) a[i] = 'done';
      a[n] = s === 'failed' ? 'fail' : s === 'pending_retry' ? 'wait' : 'active';
      return a;
    };
    const narr = d => {
      const e = d.extraction?.status, c = d.classification?.status, o = [];
      if (isDone(c)) o.push('Classification completed; checkpoint saved.');
      else o.push(c ? 'Classification ' + c + '.' : 'Classification status not reported.');
      if (d.category === 'Other') {
        o.push('Category is Other: extraction stage safely skipped to conserve LLM calls.');
      } else if (isDone(e)) {
        o.push('Extraction completed; checkpoint saved.');
      } else if (d.status === 'failed' || d.status === 'pending_retry') {
        o.push(isDone(c) ? 'Classification checkpoint retained. A retry resumes at extraction without repeating classification.' : 'A retry restarts at classification.');
      } else {
        o.push(e ? 'Extraction ' + e + '.' : 'Extraction status not reported.');
      }
      return o;
    };

    /* ===== Data hook: WebSocket live stream with automatic fallback & hidden-tab pause ===== */
    function useDash(api, fl) {
      const [s, set] = useState({ msgs: null, total: 0, page: 1, totalPages: 1, failedMsgs: [], stats: null, health: null, lastOk: null, fails: 0, allFail: false, busy: false, sawData: false, wsStatus: 'connecting', latestEvent: null });
      const fly = useRef(false), gen = useRef(0);
      const flRef = useRef(fl);
      flRef.current = fl;

      const load = useCallback(async () => {
        if (fly.current) return; fly.current = true; const g = gen.current; set(p => ({ ...p, busy: true }));
        const currentFl = flRef.current;
        const r = await Promise.allSettled([
          api.list(currentFl),
          api.stats(),
          api.health(),
          api.list({ status: 'failed', limit: 50 })
        ]);
        fly.current = false;
        if (g !== gen.current) return;
        const ok = r.filter(x => x.status === 'fulfilled').length, val = i => r[i].status === 'fulfilled';
        const listData = val(0) ? normListResponse(r[0].value) : null;
        const failedData = val(3) ? normListResponse(r[3].value).items : [];
        set(p => ({
          ...p,
          busy: false,
          msgs: listData ? listData.items : p.msgs,
          total: listData ? listData.total : p.total,
          page: listData ? listData.page : p.page,
          totalPages: listData ? listData.totalPages : p.totalPages,
          failedMsgs: val(3) ? failedData : p.failedMsgs,
          stats: val(1) ? normStats(r[1].value) : p.stats,
          health: val(2) ? normHealth(r[2].value) : p.health,
          lastOk: ok ? new Date() : p.lastOk,
          fails: ok >= 2 ? 0 : p.fails + 1,
          allFail: ok === 0,
          sawData: p.sawData || ok > 0
        }));
      }, [api]);

      useEffect(() => {
        load();
      }, [fl, load]);

      // Realtime WebSocket subscription: updates immediately when external evaluators send requests
      useEffect(() => {
        let ws = null, active = true, reconnectTimer = null;
        const connectWs = () => {
          if (!active) return;
          try {
            const wsUrl = BASE.replace(/^http/, 'ws') + '/ws';
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
              if (!active) return;
              set(p => ({ ...p, wsStatus: 'connected' }));
              try { ws.send('ping'); } catch (e) {}
            };
            ws.onmessage = evt => {
              if (!active) return;
              try {
                const data = JSON.parse(evt.data);
                if (data.type === 'event') {
                  set(p => ({ ...p, latestEvent: data }));
                  // Instant update upon any pipeline event
                  load();
                }
              } catch (e) {}
            };
            ws.onerror = () => {
              if (!active) return;
              set(p => ({ ...p, wsStatus: 'disconnected' }));
            };
            ws.onclose = () => {
              if (!active) return;
              set(p => ({ ...p, wsStatus: 'reconnecting' }));
              reconnectTimer = setTimeout(connectWs, 3000);
            };
          } catch (e) {
            reconnectTimer = setTimeout(connectWs, 3000);
          }
        };

        connectWs();

        // Fallback polling interval: adapts to WebSocket state (10s when WS is connected, 3s when disconnected)
        const t = setInterval(() => {
          if (!document.hidden) load();
        }, 5000);

        const vis = () => { if (!document.hidden) load() };
        document.addEventListener('visibilitychange', vis);

        return () => {
          active = false;
          if (reconnectTimer) clearTimeout(reconnectTimer);
          clearInterval(t);
          document.removeEventListener('visibilitychange', vis);
          if (ws) {
            try { ws.close(); } catch (e) {}
          }
        };
      }, [load]);

      return { ...s, load };
    }
    /* ===== Components ===== */
    function Header({ d, onExport, exporting, onRefresh, onStreamPractice, streamingPractice }) {
      const [now, setNow] = useState(new Date()); useEffect(() => { const t = setInterval(() => setNow(new Date()), 1e3); return () => clearInterval(t) }, []);
      const conn = !d.sawData ? (d.fails ? ['bg-terra', 'Backend unavailable'] : ['bg-mute', 'Connecting']) : d.allFail && d.fails >= 3 ? ['bg-terra', 'Backend unavailable'] : d.fails ? ['bg-ochre', 'Stale: latest request failed'] : ['bg-sage', 'Connected'];
      return h('header', { className: 'flex flex-wrap items-end justify-between gap-4 border-b border-line pb-5' },
        h('div', { className: 'flex items-center gap-4' },
          h('div', { 'aria-hidden': true, className: 'flex h-11 w-11 items-center justify-center rounded-full border border-ink font-serif text-2xl leading-none' }, 'T'),
          h('div', null, h('h1', { className: 'font-serif text-3xl leading-tight sm:text-4xl' }, 'Ticket Desk'), h('p', { className: 'text-sm text-mute' }, 'Customer support intelligence · Operations'))),
        h('div', { className: 'flex flex-wrap items-center gap-3 text-xs' },
          h('div', { className: 'text-right' }, h('div', { className: 'font-mono tn' }, now.toLocaleTimeString()), h('div', { className: 'flex items-center justify-end gap-1.5 text-mute', role: 'status' }, h('span', { className: 'h-1.5 w-1.5 rounded-full ' + conn[0] }), conn[1])),
          h('div', { className: 'inline-flex items-center gap-1.5 rounded-md border border-line bg-surf px-3 py-1.5 font-medium' },
            h('span', { className: cx('h-2 w-2 rounded-full', d.wsStatus === 'connected' ? 'bg-sage animate-pulse' : 'bg-ochre') }),
            d.wsStatus === 'connected' ? 'WebSocket Live Stream' : 'Live Realtime'
          ),
          h(Btn, { kind: 'solid', onClick: onStreamPractice, disabled: streamingPractice || d.busy, className: 'border-ochre bg-ochre text-surf hover:bg-ochre/90 font-medium' }, streamingPractice ? 'Streaming Batch…' : 'Stream Practice Batch (25)'),
          h(Btn, { onClick: onRefresh, disabled: d.busy, 'aria-label': 'Refresh now' }, d.busy ? 'Refreshing…' : 'Refresh'),
          h(Btn, { kind: 'solid', onClick: onExport, disabled: exporting }, exporting ? 'Exporting…' : 'Export results')))
    }

    const HC = { healthy: ['bg-sage', 'Healthy'], degraded: ['bg-ochre', 'Degraded'], unavailable: ['bg-terra', 'Unavailable'], unknown: ['bg-mute', 'Unknown'] };
    function Health({ d }) {
      const rec = useRef(false), [ok, setOk] = useState(false), H = d.health, bad = H && (H.llm.status === 'unavailable' || H.storage.status === 'unavailable');
      useEffect(() => { if (bad) rec.current = true; else if (H && rec.current) { rec.current = false; setOk(true); const t = setTimeout(() => setOk(false), 8e3); return () => clearTimeout(t) } }, [bad, !!H]);
      const item = (k, name, note, impact) => { const x = H ? H[k] : { status: 'unknown', detail: null }, c = HC[x.status]; return { name, x, c, note, impact } };
      const rows = [item('llm', 'System', 'Backend reachability does not imply the LLM is healthy.', 'New or pending extraction and classification stages may fail or be delayed.'), item('storage', 'Storage', '', 'Messages may not be accepted, and processing results may not be saved. Persistence cannot be confirmed.')];
      return h('div', { className: 'space-y-3' },

      const onRetry = id => run('r:' + id, () => api.retry(id), 'Retry accepted for ' + id), onRetryAll = () => run('all', () => api.retryAll(), 'Retry accepted for failed messages');
      const onExport = async () => { setExp(true); try { const b = await api.export(), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'results.json'; a.click(); URL.revokeObjectURL(u); setNote({ k: 'ok', t: 'Export downloaded from the backend.' }) } catch (e) { setNote({ k: 'err', t: 'Export failed: ' + e.message }) } setExp(false) };
      const onStreamPractice = async () => {
        setStreamingPractice(true);
        try {
          const list = await api.practice();
          for (let i = 0; i < list.length; i++) {
            const msg = list[i];
            setNote({ k: 'ok', t: `[${i + 1}/${list.length}] Submitting ${msg.message_id}…` });
            await api.submit(msg);
            d.load();
            await sleep(1000);
          }
          setNote({ k: 'ok', t: 'All 25 practice messages submitted! Watch them process in the pipeline.' });
        } catch (e) {
          setNote({ k: 'err', t: 'Streaming failed: ' + e.message });
        } finally {
          setStreamingPractice(false);
          d.load();
        }
      };
      const conn = !d.sawData ? 'Connecting' : d.fails ? 'Stale' : 'Connected';
      return h('div', { className: 'mx-auto max-w-[88rem] space-y-5 px-4 py-6 sm:px-8' },
        h(Header, { d, onExport, exporting, onRefresh: d.load, onStreamPractice, streamingPractice }),
        h(Health, { d }), h(Metrics, { d }),
        h(Explorer, {
          msgs: d.msgs,
          total: d.total,
          page: d.page,
          totalPages: d.totalPages,
          selId,
          onSelect: setSel,
          fl,
          setFl,
          loaded: d.sawData || d.fails > 0
        }),
        h(Failed, { msgs: d.failedMsgs || [], pending, onRetry, onRetryAll, onSelect: setSel }), h(Submit, { api, onDone: d.load }),
        h('footer', { className: 'flex flex-wrap items-center justify-between gap-2 border-t border-line pt-4 text-xs text-mute' }, h('span', null, 'Last successful update: ', h('span', { className: 'font-mono' }, d.lastOk ? d.lastOk.toLocaleTimeString() : 'never')), h('span', null, 'Connection: ' + conn), h('span', null, 'LLM calls: ', h('span', { className: 'font-mono tn' }, num(d.stats && d.stats.llm_calls)), ' · repeated ', h('span', { className: 'font-mono tn' }, num(d.stats && d.stats.repeated_llm_calls)))),
        h(Detail, { id: selId, api, tick, onClose: () => setSel(null), onRetry, pending, onData: setSelData }),
        note && h('div', { role: 'status', className: cx('fixed bottom-4 right-4 z-40 max-w-sm rounded-md border bg-surf px-4 py-3 text-sm shadow-sm', note.k === 'ok' ? 'border-sage' : note.k === 'warn' ? 'border-ochre' : 'border-terra') }, note.t))
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
